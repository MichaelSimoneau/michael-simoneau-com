<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="none"/>
  <defs>
    <linearGradient id="cc-g1" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15803D" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#166534" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="cc-bar1" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#166534" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#15803D" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="cc-bar2" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#16A34A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cc-bar3" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cc-bar4" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#86EFAC" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="cc-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#cc-g1)"/>

  <!-- Value Stack: ascending compensation blocks -->
  <!-- Base Salary (widest, bottom) -->
  <rect x="380" y="380" width="260" height="60" rx="8" fill="url(#cc-bar1)" stroke="rgba(22,163,74,0.4)" stroke-width="1.5"/>
  <text x="510" y="416" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="16" font-weight="600" fill="rgba(248,250,252,0.7)" text-anchor="middle">BASE SALARY</text>
  <!-- Upward arrow -->
  <polygon points="660,410 670,400 670,420" fill="rgba(74,222,128,0.3)"/>

  <!-- Performance Bonus -->
  <rect x="400" y="310" width="220" height="55" rx="8" fill="url(#cc-bar2)" stroke="rgba(34,197,94,0.4)" stroke-width="1.5"/>
  <text x="510" y="343" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" font-weight="600" fill="rgba(248,250,252,0.65)" text-anchor="middle">PERFORMANCE BONUS</text>
  <polygon points="638,337 648,327 648,347" fill="rgba(74,222,128,0.3)"/>

  <!-- Equity (RSUs / Options) -->
  <rect x="420" y="245" width="180" height="50" rx="8" fill="url(#cc-bar3)" stroke="rgba(74,222,128,0.4)" stroke-width="1.5"/>
  <text x="510" y="276" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14" font-weight="600" fill="rgba(248,250,252,0.6)" text-anchor="middle">EQUITY</text>
  <polygon points="616,270 626,260 626,280" fill="rgba(74,222,128,0.3)"/>

  <!-- Long-Term Incentives (narrowest, top) -->
  <rect x="440" y="185" width="140" height="45" rx="8" fill="url(#cc-bar4)" stroke="rgba(134,239,172,0.4)" stroke-width="1.5"/>
  <text x="510" y="213" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="13" font-weight="600" fill="rgba(248,250,252,0.55)" text-anchor="middle">LTI</text>
  <polygon points="594,207 604,197 604,217" fill="rgba(74,222,128,0.3)"/>

  <!-- Impact arc connecting Strategic Vision to Financial Value -->
  <g filter="url(#cc-glow)" opacity="0.5">
    <path d="M250 350 C250 120 770 120 770 350" fill="none" stroke="rgba(134,239,172,0.4)" stroke-width="2" stroke-dasharray="8 4"/>
    <!-- Arrow at end -->
    <polygon points="770,350 764,338 776,338" fill="rgba(134,239,172,0.4)"/>
  </g>

  <!-- Impact arc labels -->
  <g font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="12" fill="rgba(134,239,172,0.5)">
    <text x="220" y="370" text-anchor="middle">Strategic</text>
    <text x="220" y="385" text-anchor="middle">Vision</text>
    <text x="800" y="370" text-anchor="middle">Financial</text>
    <text x="800" y="385" text-anchor="middle">Value</text>
  </g>

  <!-- Impact label at arc apex -->
  <text x="510" y="140" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="13" fill="rgba(134,239,172,0.4)" text-anchor="middle" letter-spacing="0.25em" font-weight="500">IMPACT</text>

  <!-- Side annotations -->
  <g font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="11" fill="rgba(74,222,128,0.35)" letter-spacing="0.1em">
    <text x="160" y="200" text-anchor="end">INNOVATION</text>
    <text x="160" y="270" text-anchor="end">TEAM BUILDING</text>
    <text x="160" y="340" text-anchor="end">OPERATIONS</text>
    <text x="160" y="410" text-anchor="end">RISK MGMT</text>
  </g>
  <!-- Connecting dots -->
  <g fill="rgba(74,222,128,0.2)">
    <circle cx="175" cy="197" r="3"/><line x1="178" y1="197" x2="380" y2="300" stroke="rgba(74,222,128,0.08)" stroke-width="1"/>
    <circle cx="175" cy="267" r="3"/><line x1="178" y1="267" x2="400" y2="310" stroke="rgba(74,222,128,0.08)" stroke-width="1"/>
    <circle cx="175" cy="337" r="3"/><line x1="178" y1="337" x2="400" y2="350" stroke="rgba(74,222,128,0.08)" stroke-width="1"/>
    <circle cx="175" cy="407" r="3"/><line x1="178" y1="407" x2="380" y2="410" stroke="rgba(74,222,128,0.08)" stroke-width="1"/>
  </g>

  <!-- Title text -->
  <g fill="#F8FAFC" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-weight="600" text-anchor="middle">
    <text x="600" y="510" font-size="42" letter-spacing="0.08em">STRATEGIC COMPENSATION</text>
    <text x="600" y="540" font-size="20" fill="#4ADE80" font-weight="400">Beyond the Offer Letter</text>
  </g>
</svg>
