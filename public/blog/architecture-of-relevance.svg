<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="none"/>
  <defs>
    <linearGradient id="ar-g1" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Left coin glow -->
    <radialGradient id="ar-coinGlow-L" cx="365" cy="265" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#030617" stop-opacity="0"/>
    </radialGradient>
    <!-- Right coin glow -->
    <radialGradient id="ar-coinGlow-R" cx="835" cy="265" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#030617" stop-opacity="0"/>
    </radialGradient>
    <!-- Left pulse -->
    <radialGradient id="ar-pulse-L" cx="365" cy="265" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#030617" stop-opacity="0"/>
    </radialGradient>
    <!-- Right pulse -->
    <radialGradient id="ar-pulse-R" cx="835" cy="265" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#030617" stop-opacity="0"/>
    </radialGradient>
    <filter id="ar-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ar-softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#ar-g1)"/>

  <!-- Tagline above coins -->
  <text x="600" y="112" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="32" font-weight="600" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.08em" opacity="0.9">Money That Lives to Pay You Back!</text>

  <!-- LEFT COIN — Outer pulse rings -->
  <circle cx="365" cy="265" r="200" fill="url(#ar-pulse-L)"/>
  <circle cx="365" cy="265" r="185" fill="none" stroke="rgba(124,58,237,0.08)" stroke-width="1"/>
  <circle cx="365" cy="265" r="155" fill="none" stroke="rgba(124,58,237,0.12)" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="365" cy="265" r="215" fill="none" stroke="rgba(124,58,237,0.05)" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- LEFT COIN — Glow backdrop -->
  <ellipse cx="365" cy="265" rx="135" ry="128" fill="url(#ar-coinGlow-L)"/>
  <ellipse cx="365" cy="265" rx="125" ry="118" fill="none" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>

  <!-- RIGHT COIN — Outer pulse rings -->
  <circle cx="835" cy="265" r="200" fill="url(#ar-pulse-R)"/>
  <circle cx="835" cy="265" r="185" fill="none" stroke="rgba(124,58,237,0.08)" stroke-width="1"/>
  <circle cx="835" cy="265" r="155" fill="none" stroke="rgba(124,58,237,0.12)" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="835" cy="265" r="215" fill="none" stroke="rgba(124,58,237,0.05)" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- RIGHT COIN — Glow backdrop -->
  <ellipse cx="835" cy="265" rx="135" ry="128" fill="url(#ar-coinGlow-R)"/>
  <ellipse cx="835" cy="265" rx="125" ry="118" fill="none" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>

  <!-- Arteries radiating outward from LEFT coin -->
  <g stroke="rgba(220,38,38,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M240 265 C180 255 130 235 60 205"/>
    <path d="M300 180 C260 150 220 120 150 90"/>
    <path d="M300 350 C260 380 220 400 150 420"/>
  </g>

  <!-- Arteries radiating outward from RIGHT coin -->
  <g stroke="rgba(220,38,38,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M960 265 C1020 255 1070 235 1140 205"/>
    <path d="M900 180 C940 150 980 120 1050 90"/>
    <path d="M900 350 C940 380 980 400 1050 420"/>
  </g>

  <!-- Artery connecting the two coins -->
  <g stroke="rgba(220,38,38,0.2)" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M500 265 C550 250 650 250 700 265"/>
    <path d="M490 235 C560 215 640 215 710 235"/>
    <path d="M490 295 C560 315 640 315 710 295"/>
  </g>

  <!-- Value particles along arteries -->
  <g fill="#DC2626" opacity="0.5">
    <!-- Left coin particles -->
    <circle cx="160" cy="220" r="2.5"/><circle cx="100" cy="210" r="1.5"/>
    <circle cx="180" cy="400" r="2.5"/><circle cx="140" cy="415" r="1.5"/>
    <!-- Right coin particles -->
    <circle cx="1040" cy="220" r="2.5"/><circle cx="1100" cy="210" r="1.5"/>
    <circle cx="1020" cy="400" r="2.5"/><circle cx="1060" cy="415" r="1.5"/>
    <!-- Connecting particles -->
    <circle cx="560" cy="248" r="2"/><circle cx="640" cy="248" r="2"/>
    <circle cx="600" cy="260" r="1.5"/>
  </g>

  <!-- Base-3 decay curve -->
  <g opacity="0.45">
    <path d="M200 480 C300 480 350 450 450 450 C500 450 520 465 550 465 C580 465 600 455 650 455 C700 455 730 468 780 468 C830 468 870 478 950 480" stroke="rgba(124,58,237,0.4)" stroke-width="1.5" fill="none"/>
    <text x="200" y="500" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="11" fill="rgba(124,58,237,0.5)">BASE-3 DECAY</text>
    <line x1="450" y1="445" x2="450" y2="485" stroke="rgba(124,58,237,0.2)" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="450" y="440" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="10" fill="rgba(124,58,237,0.4)" text-anchor="middle">1/3</text>
    <line x1="650" y1="450" x2="650" y2="485" stroke="rgba(124,58,237,0.2)" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="650" y="445" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="10" fill="rgba(124,58,237,0.4)" text-anchor="middle">2/3</text>
  </g>

  <!-- $1 floor line -->
  <g>
    <line x1="150" y1="510" x2="1050" y2="510" stroke="rgba(220,38,38,0.45)" stroke-width="2"/>
    <text x="1060" y="514" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#DC2626" opacity="0.6">= $1</text>
    <text x="150" y="525" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="10" fill="rgba(220,38,38,0.35)">GUARANTEED FLOOR</text>
  </g>

  <!-- Title text -->
  <g fill="#F8FAFC" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-weight="600" text-anchor="middle">
    <text x="600" y="570" font-size="48" letter-spacing="0.12em" opacity="0.9">THE HUMAN DOLLAR</text>
  </g>
</svg>
