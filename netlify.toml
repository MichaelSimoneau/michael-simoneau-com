[build]
  command = "yarn expo export --platform web && node scripts/post-build-web.mjs && cp -r public/* dist/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[dev]
  targetPort = 8081

[[redirects]]
  from = "/zero.txt"
  to = "/zero.txt"
  status = 200

[[redirects]]
  from = "/zeroth.txt"
  to = "/zeroth.txt"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

