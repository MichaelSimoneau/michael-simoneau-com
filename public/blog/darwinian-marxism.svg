<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#030617"/>
  <defs>
    <linearGradient id="dm-g1" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B45309" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#78350F" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="dm-g2" cx="600" cy="280" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B45309" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#030617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dm-tendril" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#B45309" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="dm-mobius" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#D97706"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <filter id="dm-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dm-softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="60" y="60" width="1080" height="510" rx="48" fill="url(#dm-g1)" stroke="rgba(180,83,9,0.3)" stroke-width="2"/>
  <ellipse cx="600" cy="280" rx="320" ry="220" fill="url(#dm-g2)"/>

  <!-- Zooid bell shapes (Siphonophore colonial organism) -->
  <!-- Central zooid -->
  <path d="M560 160 Q600 100 640 160 Q650 200 600 220 Q550 200 560 160Z" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
  <!-- Left zooid -->
  <path d="M420 200 Q450 150 480 200 Q485 230 450 245 Q415 230 420 200Z" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1.2"/>
  <!-- Right zooid -->
  <path d="M720 200 Q750 150 780 200 Q785 230 750 245 Q715 230 720 200Z" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1.2"/>
  <!-- Far left zooid -->
  <path d="M320 260 Q345 220 370 260 Q373 285 345 295 Q317 285 320 260Z" fill="rgba(245,158,11,0.07)" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  <!-- Far right zooid -->
  <path d="M830 260 Q855 220 880 260 Q883 285 855 295 Q827 285 830 260Z" fill="rgba(245,158,11,0.07)" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>

  <!-- Tendrils flowing downward morphing into currency paths -->
  <path d="M600 220 C600 280 580 320 560 380 S540 440 530 480" stroke="url(#dm-tendril)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M600 220 C610 280 630 320 650 380 S670 440 680 480" stroke="url(#dm-tendril)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M450 245 C445 290 430 340 420 400 S410 450 405 490" stroke="url(#dm-tendril)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M750 245 C755 290 770 340 780 400 S790 450 795 490" stroke="url(#dm-tendril)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M345 295 C340 330 330 370 325 420" stroke="url(#dm-tendril)" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M855 295 C860 330 870 370 875 420" stroke="url(#dm-tendril)" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Central Mobius loop / infinity figure-8 -->
  <g filter="url(#dm-glow)" opacity="0.9">
    <path d="M540 310 C540 280 570 270 600 290 C630 310 660 300 660 270 C660 240 630 230 600 250 C570 270 540 260 540 230 C540 260 540 280 540 310Z" stroke="url(#dm-mobius)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Zooid labels -->
  <g fill="#F59E0B" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="0.85">
    <text x="345" y="318">SEAL</text>
    <text x="600" y="252">BRAIN</text>
    <text x="855" y="318">HANDS</text>
  </g>

  <!-- Connecting lines between zooids -->
  <line x1="380" y1="280" x2="550" y2="220" stroke="rgba(245,158,11,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="820" y1="280" x2="650" y2="220" stroke="rgba(245,158,11,0.2)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- VSL formula glowing faintly in the background -->
  <g filter="url(#dm-softglow)" opacity="0.12">
    <text x="600" y="480" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="42" font-weight="300" fill="#F59E0B" text-anchor="middle" letter-spacing="0.08em">E = M * (V[T] / t)²</text>
  </g>

  <!-- Title text -->
  <g fill="#F8FAFC" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-weight="600" text-anchor="middle">
    <text x="600" y="120" font-size="14" fill="#D97706" letter-spacing="0.35em" font-weight="500">THE SOVEREIGN STACK</text>
    <text x="600" y="530" font-size="52" letter-spacing="0.12em">DARWINIAN MARXISM</text>
    <text x="600" y="558" font-size="22" fill="#F59E0B" font-weight="400">The Biological Economy</text>
  </g>
</svg>
