<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="none"/>
  <defs>
    <linearGradient id="ai-g1" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7E22CE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5B21B6" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="ai-shield" cx="600" cy="300" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7E22CE" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#5B21B6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#030617" stop-opacity="0"/>
    </radialGradient>
    <filter id="ai-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ai-softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ai-redglow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#ai-g1)"/>

  <!-- Neural network nodes -->
  <!-- Layer 1 (input) -->
  <circle cx="350" cy="180" r="14" fill="rgba(126,34,206,0.2)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
  <circle cx="350" cy="260" r="14" fill="rgba(126,34,206,0.2)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
  <circle cx="350" cy="340" r="14" fill="rgba(126,34,206,0.2)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
  <circle cx="350" cy="420" r="14" fill="rgba(126,34,206,0.2)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>

  <!-- Layer 2 (hidden) -->
  <circle cx="520" cy="200" r="16" fill="rgba(126,34,206,0.25)" stroke="rgba(167,139,250,0.5)" stroke-width="1.5"/>
  <circle cx="520" cy="300" r="16" fill="rgba(126,34,206,0.25)" stroke="rgba(167,139,250,0.5)" stroke-width="1.5"/>
  <circle cx="520" cy="400" r="16" fill="rgba(126,34,206,0.25)" stroke="rgba(167,139,250,0.5)" stroke-width="1.5"/>

  <!-- Layer 3 (hidden) - one node is POISONED (red) -->
  <circle cx="680" cy="220" r="16" fill="rgba(126,34,206,0.25)" stroke="rgba(167,139,250,0.5)" stroke-width="1.5"/>
  <circle cx="680" cy="320" r="18" fill="rgba(220,38,38,0.3)" stroke="rgba(248,113,113,0.6)" stroke-width="2" filter="url(#ai-redglow)"/>
  <circle cx="680" cy="400" r="16" fill="rgba(126,34,206,0.25)" stroke="rgba(167,139,250,0.5)" stroke-width="1.5"/>

  <!-- Layer 4 (output) -->
  <circle cx="850" cy="260" r="14" fill="rgba(126,34,206,0.2)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
  <circle cx="850" cy="360" r="14" fill="rgba(126,34,206,0.2)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>

  <!-- Neural network edges -->
  <g stroke="rgba(167,139,250,0.12)" stroke-width="1">
    <!-- L1 to L2 -->
    <line x1="364" y1="180" x2="504" y2="200"/><line x1="364" y1="180" x2="504" y2="300"/><line x1="364" y1="180" x2="504" y2="400"/>
    <line x1="364" y1="260" x2="504" y2="200"/><line x1="364" y1="260" x2="504" y2="300"/><line x1="364" y1="260" x2="504" y2="400"/>
    <line x1="364" y1="340" x2="504" y2="200"/><line x1="364" y1="340" x2="504" y2="300"/><line x1="364" y1="340" x2="504" y2="400"/>
    <line x1="364" y1="420" x2="504" y2="200"/><line x1="364" y1="420" x2="504" y2="300"/><line x1="364" y1="420" x2="504" y2="400"/>
    <!-- L2 to L3 -->
    <line x1="536" y1="200" x2="664" y2="220"/><line x1="536" y1="200" x2="664" y2="320"/><line x1="536" y1="200" x2="664" y2="400"/>
    <line x1="536" y1="300" x2="664" y2="220"/><line x1="536" y1="300" x2="664" y2="320"/><line x1="536" y1="300" x2="664" y2="400"/>
    <line x1="536" y1="400" x2="664" y2="220"/><line x1="536" y1="400" x2="664" y2="320"/><line x1="536" y1="400" x2="664" y2="400"/>
    <!-- L3 to L4 -->
    <line x1="696" y1="220" x2="836" y2="260"/><line x1="696" y1="220" x2="836" y2="360"/>
    <line x1="696" y1="320" x2="836" y2="260"/><line x1="696" y1="320" x2="836" y2="360"/>
    <line x1="696" y1="400" x2="836" y2="260"/><line x1="696" y1="400" x2="836" y2="360"/>
  </g>

  <!-- Shield overlay (translucent arc protecting the network) -->
  <path d="M300 140 C300 140 600 100 900 140 L900 460 C900 460 600 500 300 460 Z" fill="url(#ai-shield)" stroke="rgba(167,139,250,0.25)" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Scanning beam catching the poisoned node -->
  <g filter="url(#ai-softglow)" opacity="0.7">
    <line x1="680" y1="170" x2="680" y2="290" stroke="rgba(248,113,113,0.4)" stroke-width="24" stroke-linecap="round"/>
    <text x="680" y="165" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#F87171" text-anchor="middle" letter-spacing="0.1em">DETECTED</text>
  </g>

  <!-- Adversarial arrows being deflected -->
  <g stroke="rgba(248,113,113,0.5)" stroke-width="2" stroke-linecap="round">
    <!-- Arrow 1: incoming from left, deflected -->
    <line x1="120" y1="200" x2="280" y2="250"/>
    <polygon points="280,250 268,244 272,256" fill="rgba(248,113,113,0.4)"/>
    <!-- Deflection spark -->
    <line x1="295" y1="255" x2="310" y2="220" stroke="rgba(167,139,250,0.4)" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="295" y1="255" x2="320" y2="260" stroke="rgba(167,139,250,0.4)" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Arrow 2: incoming from top -->
    <line x1="500" y1="80" x2="500" y2="130"/>
    <polygon points="500,130 494,118 506,118" fill="rgba(248,113,113,0.4)"/>
    <line x1="500" y1="138" x2="480" y2="100" stroke="rgba(167,139,250,0.4)" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Arrow 3: incoming from right -->
    <line x1="1060" y1="350" x2="920" y2="380"/>
    <polygon points="920,380 932,374 928,386" fill="rgba(248,113,113,0.4)"/>
    <line x1="910" y1="385" x2="930" y2="420" stroke="rgba(167,139,250,0.4)" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Shield label -->
  <text x="600" y="480" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="11" fill="rgba(167,139,250,0.4)" text-anchor="middle" letter-spacing="0.3em">DEFENSE PERIMETER</text>

  <!-- Title text -->
  <g fill="#F8FAFC" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-weight="600" text-anchor="middle">
    <text x="600" y="545" font-size="48" letter-spacing="0.1em">PRACTICAL AI SECURITY</text>
    <text x="600" y="570" font-size="20" fill="#A78BFA" font-weight="400">Bridging Gaps in Modern Deployments</text>
  </g>
</svg>
