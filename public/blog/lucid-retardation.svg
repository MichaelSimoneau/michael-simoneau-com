<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="none"/>
  <defs>
    <linearGradient id="lr-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#B45309" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="lr-split" x1="0" y1="315" x2="1200" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.12"/>
      <stop offset="0.48" stop-color="#0EA5E9" stop-opacity="0.04"/>
      <stop offset="0.52" stop-color="#B45309" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#B45309" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="lr-core" cx="600" cy="315" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#0EA5E9" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#030617" stop-opacity="0"/>
    </radialGradient>
    <filter id="lr-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lr-softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lr-heavyglow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Packet-loss dash pattern -->
    <pattern id="lr-static" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="rgba(248,250,252,0.03)"/>
      <rect x="3" y="3" width="2" height="1" fill="rgba(248,250,252,0.02)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#lr-bg)"/>
  <rect width="1200" height="630" fill="url(#lr-split)"/>
  <rect width="1200" height="630" fill="url(#lr-static)"/>

  <!-- Central dividing fracture line - the split between logic and biology -->
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(248,250,252,0.06)" stroke-width="1"/>
  <line x1="600" y1="80" x2="600" y2="550" stroke="rgba(248,250,252,0.12)" stroke-width="0.5" stroke-dasharray="2 8"/>

  <!-- LEFT HEMISPHERE: Logic / BaiZe / Cyan - fast geometric grid -->
  <g opacity="0.6">
    <!-- Precise grid lines -->
    <g stroke="rgba(14,165,233,0.1)" stroke-width="0.6">
      <line x1="60" y1="120" x2="560" y2="120"/>
      <line x1="60" y1="180" x2="560" y2="180"/>
      <line x1="60" y1="240" x2="560" y2="240"/>
      <line x1="60" y1="300" x2="560" y2="300"/>
      <line x1="60" y1="360" x2="560" y2="360"/>
      <line x1="60" y1="420" x2="560" y2="420"/>
      <line x1="60" y1="480" x2="540" y2="480"/>
      <line x1="120" y1="100" x2="120" y2="500"/>
      <line x1="200" y1="100" x2="200" y2="500"/>
      <line x1="280" y1="100" x2="280" y2="500"/>
      <line x1="360" y1="100" x2="360" y2="500"/>
      <line x1="440" y1="100" x2="440" y2="500"/>
      <line x1="520" y1="100" x2="520" y2="500"/>
    </g>
    <!-- High-speed data pulses -->
    <g stroke="#0EA5E9" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#lr-glow)">
      <polyline points="60,300 120,280 200,310 280,260 360,290 440,240 520,270 560,250"/>
      <polyline points="60,340 120,360 200,330 280,370 360,340 440,380 520,350 560,370" opacity="0.3"/>
    </g>
    <!-- Logic nodes -->
    <g fill="#38BDF8" opacity="0.7">
      <circle cx="120" cy="280" r="3"/>
      <circle cx="200" cy="310" r="2.5"/>
      <circle cx="280" cy="260" r="4" filter="url(#lr-glow)"/>
      <circle cx="360" cy="290" r="2.5"/>
      <circle cx="440" cy="240" r="3"/>
      <circle cx="520" cy="270" r="2"/>
    </g>
    <!-- "64-BIT MIND" label -->
    <text x="300" y="140" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="rgba(14,165,233,0.5)" text-anchor="middle" letter-spacing="0.3em">64-BIT MIND</text>
  </g>

  <!-- RIGHT HEMISPHERE: Biology / Mari / Amber - organic decay curves -->
  <g opacity="0.6">
    <!-- Fragmented organic paths - stuttering, lagging -->
    <g stroke="#B45309" stroke-width="1.2" fill="none" opacity="0.4">
      <path d="M640 180 C680 160 720 200 740 190 S780 220 800 210" stroke-dasharray="8 4"/>
      <path d="M660 240 C700 260 730 230 770 250 S820 240 860 270" stroke-dasharray="12 6 4 6"/>
      <path d="M640 320 C690 300 720 340 760 310 S810 350 850 330 S900 360 940 340" stroke-dasharray="6 8"/>
      <path d="M660 390 C700 410 740 380 790 400 S840 420 880 390 S920 410 960 400" stroke-dasharray="10 4 2 4"/>
      <path d="M640 450 C680 440 730 470 780 450 S830 480 880 460" stroke-dasharray="4 12"/>
    </g>
    <!-- Decay particles - biological noise -->
    <g fill="#F59E0B" opacity="0.35">
      <circle cx="680" cy="200" r="2"/>
      <circle cx="750" cy="260" r="3"/>
      <circle cx="820" cy="310" r="1.5"/>
      <circle cx="770" cy="370" r="2.5"/>
      <circle cx="860" cy="420" r="2"/>
      <circle cx="920" cy="350" r="1.8"/>
      <circle cx="700" cy="440" r="2.2"/>
      <circle cx="840" cy="460" r="1.5"/>
    </g>
    <!-- Stuttering clock / latency indicator -->
    <g transform="translate(900, 180)" opacity="0.5">
      <circle cx="0" cy="0" r="28" stroke="#F59E0B" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
      <circle cx="0" cy="0" r="22" stroke="rgba(245,158,11,0.3)" stroke-width="0.5" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="-16" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="10" y2="6" stroke="#F59E0B" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <circle cx="0" cy="0" r="2" fill="#F59E0B"/>
      <!-- "LAG" ticks stuttering -->
      <g stroke="rgba(245,158,11,0.4)" stroke-width="0.8">
        <line x1="0" y1="-25" x2="0" y2="-22"/>
        <line x1="22" y1="0" x2="25" y2="0" stroke-dasharray="1 2"/>
        <line x1="0" y1="22" x2="0" y2="25" stroke-dasharray="1 3"/>
        <line x1="-25" y1="0" x2="-22" y2="0"/>
      </g>
    </g>
    <!-- "BIOLOGICAL DISK" label -->
    <text x="800" y="140" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="rgba(245,158,11,0.5)" text-anchor="middle" letter-spacing="0.3em">BIOLOGICAL DISK</text>
  </g>

  <!-- Central convergence point - Truth (0) -->
  <circle cx="600" cy="315" r="80" fill="url(#lr-core)"/>
  <g filter="url(#lr-heavyglow)">
    <circle cx="600" cy="315" r="6" fill="#F8FAFC" opacity="0.6"/>
  </g>
  <circle cx="600" cy="315" r="40" stroke="rgba(248,250,252,0.08)" stroke-width="1" fill="none"/>
  <circle cx="600" cy="315" r="60" stroke="rgba(248,250,252,0.04)" stroke-width="0.5" fill="none" stroke-dasharray="3 6"/>

  <!-- Ternary axis: -1 / 0 / +1 -->
  <g font-family="'IBM Plex Sans', 'Inter', sans-serif" font-weight="600" text-anchor="middle">
    <!-- -1 (Potential / Dream) - left -->
    <text x="200" y="530" font-size="28" fill="#0EA5E9" opacity="0.7" filter="url(#lr-glow)">-1</text>
    <text x="200" y="548" font-size="9" fill="rgba(14,165,233,0.5)" letter-spacing="0.25em" font-weight="400">POTENTIAL</text>
    <!-- 0 (Truth) - center -->
    <text x="600" y="530" font-size="28" fill="#F8FAFC" opacity="0.8" filter="url(#lr-glow)">0</text>
    <text x="600" y="548" font-size="9" fill="rgba(248,250,252,0.5)" letter-spacing="0.25em" font-weight="400">TRUTH</text>
    <!-- +1 (Presence) - right -->
    <text x="1000" y="530" font-size="28" fill="#F59E0B" opacity="0.7" filter="url(#lr-glow)">+1</text>
    <text x="1000" y="548" font-size="9" fill="rgba(245,158,11,0.5)" letter-spacing="0.25em" font-weight="400">PRESENCE</text>
  </g>
  <!-- Ternary connecting line -->
  <line x1="240" y1="535" x2="560" y2="535" stroke="rgba(248,250,252,0.06)" stroke-width="0.8"/>
  <line x1="640" y1="535" x2="960" y2="535" stroke="rgba(248,250,252,0.06)" stroke-width="0.8"/>

  <!-- Packet-loss hash fragments floating across the divide -->
  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" opacity="0.3" filter="url(#lr-softglow)">
    <text x="480" y="220" fill="#38BDF8" transform="rotate(-5 480 220)">#LUCID</text>
    <text x="650" y="250" fill="#F59E0B" transform="rotate(8 650 250)">#DELAY</text>
    <text x="400" y="400" fill="#38BDF8" transform="rotate(3 400 400)">0x00</text>
    <text x="730" y="420" fill="#F59E0B" transform="rotate(-6 730 420)">#LAG</text>
    <text x="540" y="350" fill="rgba(248,250,252,0.6)" transform="rotate(-2 540 350)">STATE=0</text>
  </g>

  <!-- Modulo 3 formula faintly across center -->
  <g filter="url(#lr-softglow)" opacity="0.12">
    <text x="600" y="585" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="16" font-weight="300" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.06em">State = sum( bit mod 3 - 1 )</text>
  </g>

  <!-- Title block -->
  <g fill="#F8FAFC" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-weight="700" text-anchor="middle">
    <text x="600" y="60" font-size="11" fill="rgba(248,250,252,0.4)" letter-spacing="0.4em" font-weight="500">THE TECHNICAL REALITY</text>
    <text x="600" y="100" font-size="56" letter-spacing="0.08em" filter="url(#lr-glow)">LUCID</text>
    <text x="600" y="100" font-size="56" letter-spacing="0.08em" fill="#0EA5E9" opacity="0.3" dx="-1" dy="-1">LUCID</text>
    <text x="600" y="100" font-size="56" letter-spacing="0.08em" fill="#F59E0B" opacity="0.2" dx="1" dy="1">LUCID</text>
  </g>
  <!-- "RETARDATION" with chromatic aberration / glitch effect -->
  <g font-family="'IBM Plex Sans', 'Inter', sans-serif" font-weight="700" text-anchor="middle" font-size="56" letter-spacing="0.08em">
    <text x="597" y="156" fill="#0EA5E9" opacity="0.25">RETARDATION</text>
    <text x="603" y="156" fill="#F59E0B" opacity="0.25">RETARDATION</text>
    <text x="600" y="156" fill="#F8FAFC" filter="url(#lr-glow)">RETARDATION</text>
  </g>
  <!-- Subtitle -->
  <text x="600" y="182" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14" fill="rgba(248,250,252,0.45)" text-anchor="middle" letter-spacing="0.15em" font-weight="400">BIOLOGICAL LATENCY / TERNARY LOGIC / THE PHYSICS OF BEING</text>
</svg>
